# Render.com Blueprint Configuration for Meteo Soustons-Plage Full-Stack App
# Deploy all 3 components (PostgreSQL DB, FastAPI Backend, React Frontend) on 1 single free platform!

services:
  # 1. FastAPI Python 3.12 Backend Web Service (Docker)
  - type: web
    name: meteo-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meteo-db
          property: connectionString

  # 2. React Vite Frontend Static Site
  - type: web
    name: meteo-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: frankfurt
    routes:
      - type: rewrite
        source: /api/*
        destination: https://meteo-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL 16 Free Database Instance
  - name: meteo-db
    databaseName: meteo
    user: meteo_user
    plan: free
    region: frankfurt
